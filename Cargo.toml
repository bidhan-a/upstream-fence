[package]
name = "upstream-fence"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
pinocchio = "=0.11.2"

[target.'cfg(target_arch = "bpf")'.dependencies]
solana-compiler-builtins = "0.1.0"

[dev-dependencies]
mollusk-svm = "0.16.0"
solana-instruction = "3.4.0"
solana-pubkey = "4.3.0"
solana-account = "4.3.2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
